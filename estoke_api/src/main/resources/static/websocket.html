
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estokê - Monitoramento em Tempo Real</title>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f3f0fa;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            background: #6541a5;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
        }

        .status {
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #999;
        }

        .conectado {
            border-color: #219653;
        }

        .desconectado {
            border-color: #d64545;
        }

        .evento {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #00000010;
        }

        .evento h3 {
            margin-top: 0;
            color: #6541a5;
        }

        .vazio {
            text-align: center;
            padding: 30px;
            color: #777;
            background: white;
            border-radius: 8px;
        }

        button {
            background: #6541a5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover {
            background: #4f3185;
        }

        .data {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Estokê</h1>
        <p>Monitoramento de movimentações em tempo real</p>
    </header>

    <div id="status" class="status desconectado">
        <strong>Status:</strong> Desconectado
    </div>

    <button onclick="conectar()">Conectar novamente</button>

    <h2>Histórico de eventos</h2>

    <div id="eventos">
        <div class="vazio">
            Aguardando movimentações...
        </div>
    </div>

</div>

<script>

    let cliente = null;

    function atualizarStatus(mensagem, conectado) {

        const status = document.getElementById("status");

        status.innerHTML = "<strong>Status:</strong> " + mensagem;

        status.className = conectado
            ? "status conectado"
            : "status desconectado";
    }

    function conectar() {

        if (cliente) {
            cliente.deactivate();
        }

        cliente = new StompJs.Client({

            brokerURL: "ws://" + window.location.host + "/ws",

            reconnectDelay: 5000,

            onConnect: function () {

                atualizarStatus("Conectado ao servidor", true);

                cliente.subscribe(
                    "/topic/movimentacoes",
                    function (mensagem) {

                        const evento = JSON.parse(mensagem.body);

                        exibirEvento(evento);
                    }
                );
            },

            onStompError: function (frame) {

                atualizarStatus("Erro na conexão", false);

                console.error(frame);
            },

            onWebSocketClose: function () {

                atualizarStatus("Desconectado", false);
            },

            onWebSocketError: function (erro) {

                atualizarStatus("Erro de comunicação", false);

                console.error(erro);
            }

        });

        cliente.activate();
    }

    function exibirEvento(evento) {

        const area = document.getElementById("eventos");

        const vazio = area.querySelector(".vazio");

        if (vazio) {
            area.innerHTML = "";
        }

        const elemento = document.createElement("div");

        elemento.className = "evento";

        const titulo = document.createElement("h3");
        titulo.textContent = "Movimentação " + evento.acao;

        const material = document.createElement("p");
        material.textContent = "Material: " + evento.material;

        const tipo = document.createElement("p");
        tipo.textContent = "Tipo: " + evento.tipo;

        const quantidade = document.createElement("p");
        quantidade.textContent = "Quantidade: " + evento.quantidade;

        const motivo = document.createElement("p");
        motivo.textContent = "Motivo: " + evento.motivo;

        const data = document.createElement("p");
        data.className = "data";
        data.textContent = "Recebido em: " + new Date().toLocaleString("pt-BR");

        elemento.append(
            titulo,
            material,
            tipo,
            quantidade,
            motivo,
            data
        );

        area.prepend(elemento);
    }

    conectar();

</script>

</body>
</html>
